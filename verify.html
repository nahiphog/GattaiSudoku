<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify a solution · Daily Gattai Sudoku</title>
  <meta name="description" content="Verify a Gattai Sudoku solution. Enter or import a partial Gattai puzzle to check if it has zero, one, or multiple valid solutions." />
  <meta property="og:title" content="Verify a Gattai Sudoku Solution" />
  <meta property="og:description" content="Check a Gattai Sudoku puzzle for uniqueness. Enter a 144-character string or fill the grid interactively." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gattaisudoku.com/verify.html" />
  <meta property="og:locale" content="en_US" />
  <link rel="canonical" href="https://gattaisudoku.com/verify.html" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath fill='%23ed6239' d='M30 30h60v60H30z'/%3E%3Cpath fill='none' stroke='%23ed6239' stroke-width='6' d='M10 0v90M20 0v90M30 0v120M40 0v120M50 0v120M60 0v120M70 0v120M80 0v120M90 0v120M100 30v90M110 30v90M0 10h90M0 20h90M0 30h120M0 40h120M0 50h120M0 60h120M0 70h120M0 80h120M0 90h120M30 100h90M30 110h90'/%3E%3C/svg%3E" />
  <link rel="alternate" hreflang="en" href="https://gattaisudoku.com/verify.html" />
</head>
<body class="verify-page">
  <header>
    <div class="header-start"><a class="verify-back" href="/">← Puzzle</a></div>
    <div class="brand-stack"><div class="brand"><span>Daily</span><span>Gattai</span><span>Sudoku</span></div></div>
    <div class="header-end"><span class="verify-title">Verify a solution</span></div>
  </header>
  <main class="verify-main">
    <section class="verify-intro">
      <h1>Verify a solution</h1>
      <p>Enter or import a partial Gattai puzzle. The checker determines whether its clues lead to zero, one, or multiple valid solutions.</p>
    </section>
    <section class="verify-workspace">
      <div class="verify-board-column">
        <div id="verifyBoard" class="board verify-board" aria-label="Editable Gattai Sudoku verification grid"></div>
        <p id="inputGivenCount" class="verify-given-count">0 given cells</p>
        <section id="inputTechniqueTally" class="verify-input-tally" hidden aria-live="polite"><h2>Technique tally</h2><div id="tallyResults"></div></section>
      </div>
      <aside class="verify-actions">
        <button id="verifyGrid" class="dialog-primary" type="button">Check uniqueness</button>
        <button id="clearGrid" class="verify-secondary" type="button">Clear grid</button>
        <label class="verify-string-label" for="solutionString">144-character string</label>
        <textarea id="solutionString" rows="7" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste a 144-character Gattai string"></textarea>
        <button id="importString" class="verify-secondary" type="button">Import string</button>
        <button id="exportString" class="verify-secondary" type="button">Copy string</button>
        <p id="verifyStatus" class="dialog-status" aria-live="polite"></p>
        <p id="uniquenessTime" class="verify-timing" hidden></p>
        <button id="evaluateDifficulty" class="dialog-primary" type="button" hidden>Evaluate puzzle difficulty</button>
        <button id="copyInputImage" class="verify-secondary" type="button" hidden>Copy input grid as image</button>
        <button id="copyCompletedImage" class="verify-secondary" type="button" hidden>Copy completed grid as image</button>
        <div id="solutionResults" class="verify-results" aria-live="polite"></div>
      </aside>
    </section>
    <section id="walkthrough" class="verify-walkthrough" hidden aria-live="polite">
      <h2>Solution walkthrough</h2>
      <p id="walkthroughRating"></p><p id="evaluationTime" class="verify-timing"></p>
      <div class="verify-step-controls" aria-label="Solution walkthrough controls"><button id="firstWalkthroughStep" type="button" aria-label="First step">&lt;&lt;</button><button id="previousWalkthroughStep" type="button" aria-label="Previous step">&lt;</button><span id="walkthroughStepCount"></span><button id="nextWalkthroughStep" type="button" aria-label="Next step">&gt;</button><button id="lastWalkthroughStep" type="button" aria-label="Last step">&gt;&gt;</button></div>
      <div class="verify-step-workspace"><div id="walkthroughGrid" class="board verify-walkthrough-grid" aria-label="Interactive walkthrough grid"></div><div class="verify-step-explanation"><h3 id="walkthroughTechnique"></h3><p id="walkthroughReasoning"></p></div></div>
    </section>
  </main>
  <script src="/verify.js"></script>
</body>
</html>
