<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gattai Sudoku Studio</title>
  <meta name="description" content="A human-first Gattai Sudoku lesson and daily puzzle board." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="week.css" />
</head>
<body>
  <header><div class="brand">GATTAI <span>SUDOKU</span></div><p>Two boards. One shared logic.</p></header>
  <main>
    <section class="board-card" aria-label="Gattai Sudoku puzzle">
      <aside class="day-sidebar" aria-label="Daily puzzles"><span>Daily</span><button class="day-button" data-day="monday" aria-pressed="false">Mon 7</button><button class="day-button" data-day="tuesday" aria-pressed="true">Tue 8</button></aside>
      <section class="puzzle-surface"><div id="board" class="board"></div><div class="board-footer"><button id="solutionToggle" type="button" aria-pressed="false">Solution</button><span id="givenCount"></span><button id="copyPng" type="button">Copy as a picture</button></div><section class="guide hidden" id="guide"><p class="eyebrow">SOLUTION WALKTHROUGH</p><div class="step-panel" aria-live="polite"><p class="eyebrow" id="stepCount"></p><h3 id="stepTechnique"></h3><p id="stepReasoning"></p></div><div class="step-controls"><button id="previousStep">Previous</button><button id="nextStep">Next</button></div></section></section>
      <aside class="grid-sidebar" aria-label="Grid highlights"><span>Highlight</span><button class="grid-button" data-grid="a" aria-pressed="false">Grid 1</button><button class="grid-button" data-grid="b" aria-pressed="false">Grid 2</button></aside>
    </section>
  </main>
  <footer>Built for deliberate solving · Method names follow <a href="https://github.com/AImenes/sudokUI">sudokUI</a></footer>
  <script src="app.js"></script>
</body>
</html>
