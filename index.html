<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gattai Sudoku Studio</title>
  <meta name="description" content="A human-first Gattai Sudoku lesson and daily puzzle board." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="week.css" />
</head>
<body>
  <header><div class="brand">GATTAI <span>SUDOKU</span></div><p>Two boards. One shared logic.</p></header>
  <main>
    <section class="board-card" aria-label="Gattai Sudoku puzzle">
      <div class="grid-tools" aria-label="Puzzle controls"><span>Mode:</span><button class="mode-button" data-mode="human" aria-pressed="true">Play</button><button class="mode-button" data-mode="solver" aria-pressed="false">Solution</button><span class="mode-status" id="modeStatus"></span><button class="grid-button" data-grid="a" aria-pressed="false">Grid 1</button><button class="grid-button" data-grid="b" aria-pressed="false">Grid 2</button></div>
      <section class="guide hidden" id="guide"><p class="eyebrow">SOLUTION WALKTHROUGH</p><div class="step-panel" aria-live="polite"><p class="eyebrow" id="stepCount"></p><h3 id="stepTechnique"></h3><p id="stepReasoning"></p></div><div class="step-controls"><button id="previousStep">Previous</button><button id="nextStep">Next</button></div></section>
      <div id="board" class="board"></div>
      <button id="copyPng" type="button">Copy grid as PNG</button>
    </section>
  </main>
  <footer>Built for deliberate solving · Method names follow <a href="https://github.com/AImenes/sudokUI">sudokUI</a></footer>
  <script src="app.js"></script>
</body>
</html>
